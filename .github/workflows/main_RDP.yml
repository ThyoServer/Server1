name: Thyo Private Tunnel RDP

on:
  workflow_dispatch:

jobs:
  build-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Konfigurasi Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Tunnel" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          
          Write-Host "Membuat Akun RDP..."
          $password = ConvertTo-SecureString "ThyoRDP123" -AsPlainText -Force
          New-LocalUser -Name "admin_user" -Password $password -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "admin_user"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "admin_user"

      - name: Menghubungkan ke Server Railway Thyo
        run: |
          Write-Host "Download Chisel Engine..."
          Invoke-WebRequest -Uri "https://github.com/jpillora/chisel/releases/download/v1.9.1/chisel_1.9.1_windows_amd64.gz" -OutFile "chisel.gz"
          
          Write-Host "Mengekstrak file..."
          7z e chisel.gz
          
          Write-Host "Mengubah nama menjadi aplikasi (.exe)..."
          Rename-Item -Path "chisel" -NewName "chisel.exe" -Force
          
          Write-Host "Membuka Terowongan ke Railway..."
          # Perintah ini mengirim RDP GitHub masuk ke dalam Railway milikmu
          .\chisel.exe client https://serverubuntu.up.railway.app R:3389:127.0.0.1:3389
