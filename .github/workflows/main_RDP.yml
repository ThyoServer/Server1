name: RDP On-Demand

# [BARU] Sistem ini akan aktif JIKA MENDAPATKAN PERINTAH dari Web ThyoCloud
on:
  workflow_dispatch:
    inputs:
      userEmail:
        description: 'Email User Pemesan'
        required: true
      customUsername:
        description: 'Username Pilihan User'
        required: true
        default: 'thyocloud'
      wallpaperUrl:
        description: 'Link Wallpaper Custom'
        required: false

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Baca Perintah dari Web ThyoCloud
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "USER_EMAIL=${{ github.event.inputs.userEmail }}"
          Add-Content -Path $env:GITHUB_ENV -Value "CUSTOM_USERNAME=${{ github.event.inputs.customUsername }}"
          Add-Content -Path $env:GITHUB_ENV -Value "WALLPAPER_URL=${{ github.event.inputs.wallpaperUrl }}"

      - name: 2. Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force;
          netsh advfirewall firewall delete rule name="RDP-Inbound" -ErrorAction SilentlyContinue;
          netsh advfirewall firewall add rule name="RDP-Inbound" dir=in action=allow protocol=TCP localport=3389;
          Restart-Service -Name TermService -Force;

      - name: 3. Create Custom RDP User
        run: |
          $username = $env:CUSTOM_USERNAME
          if ([string]::IsNullOrWhiteSpace($username)) { $username = "thyocloud" }
          
          # Acak Password Super Kuat (Anti Brute-Force)
          $charSet = @{ Upper = [char[]](65..90); Lower = [char[]](97..122); Number = [char[]](48..57) };
          $rawPassword = @();
          $rawPassword += $charSet.Upper | Get-Random -Count 4;
          $rawPassword += $charSet.Lower | Get-Random -Count 4;
          $rawPassword += $charSet.Number | Get-Random -Count 4;
          $password = -join ($rawPassword | Sort-Object { Get-Random });
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force;
          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) { Remove-LocalUser -Name $username }
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires;
          Add-LocalGroupMember -Group "Administrators" -Member $username;
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username;
          
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_USER=$username";
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_CREDS=$password";

      - name: 4. Windows Optimization & Custom Wallpaper
        run: |
          netsh advfirewall firewall add rule name="Web-Dev-Ports" dir=in action=allow protocol=TCP localport=3000,5500,8080,80;
          Set-Service -Name "Audiosrv" -StartupType Automatic; Start-Service -Name "Audiosrv";
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableAudioCapture" -Value 0 -Force;
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -Force;
          
          # Terapkan Wallpaper 1 Kali di Awal Saja
          if (![string]::IsNullOrWhiteSpace($env:WALLPAPER_URL)) {
              Write-Host "Mengunduh Custom Wallpaper dari CDN..."
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              $SavePath = "C:\Users\Public\Pictures\ThyoCloud_Wallpaper.jpg"
              Invoke-WebRequest -Uri $env:WALLPAPER_URL -OutFile $SavePath -UseBasicParsing
              
              $policyPath = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System"
              if (!(Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }
              Set-ItemProperty -Path $policyPath -Name "Wallpaper" -Value $SavePath
              Set-ItemProperty -Path $policyPath -Name "WallpaperStyle" -Value "2"
          }

      - name: 5. Setup SSH Key for VPS Gateway
        run: |
          Set-Content -Path "id_rsa" -Value "${{ secrets.AWS_SSH_KEY }}" -Encoding ascii
          $user = $env:USERNAME
          icacls "id_rsa" /inheritance:d
          icacls "id_rsa" /remove "Authenticated Users"
          icacls "id_rsa" /remove "BUILTIN\Users"
          icacls "id_rsa" /grant "${user}:F"

      - name: 6. Lapor Kredensial ke ThyoCloud
        run: |
          $remotePort = Get-Random -Minimum 3000 -Maximum 4001;
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_PORT=$remotePort";
          
          # Payload Kredensial Akhir yang akan men-trigger status 'Active' di Web
          $payload = @{
            email     = $env:USER_EMAIL
            ip        = "thyoserver.web.id:$remotePort"
            username  = $env:RDP_USER
            password  = $env:RDP_CREDS
          } | ConvertTo-Json
          
          Invoke-RestMethod -Uri "https://thyocloud.up.railway.app/api/rdp" -Method Post -Body $payload -ContentType 'application/json' -ErrorAction SilentlyContinue

      - name: 7. SSH Tunnel & Live Telemetry (CPU Monitor)
        run: |
          $jobScript = {
            param($serverId, $apiUrl)
            while($true) {
              try {
                $cpuLoad = [math]::Round((Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average)
                $topApp = (Get-Process | Where-Object {$_.MainWindowTitle -ne ""} | Sort-Object CPU -Descending | Select-Object -First 1 Name).Name
                if ([string]::IsNullOrWhiteSpace($topApp)) { $topApp = "System Idle" }
                
                $payload = @{
                  action   = "telemetry"
                  serverId = $serverId
                  cpuLoad  = $cpuLoad
                  activity = $topApp
                } | ConvertTo-Json
                
                Invoke-RestMethod -Uri $apiUrl -Method Post -Body $payload -ContentType 'application/json' -ErrorAction SilentlyContinue
              } catch {}
              Start-Sleep -Seconds 10
            }
          }
          
          # ========================================================
          # 🚨 PENTING: UBAH "Server-1" SESUAI DENGAN NAMA REPO-NYA!
          # Contoh: Di repo Server2 ganti jadi "Server-2"
          # ========================================================
          Start-Job -ScriptBlock $jobScript -ArgumentList "Server-1", "https://thyocloud.up.railway.app/api/rdp"
          
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ServerAliveInterval=60 -i id_rsa -R ${env:RDP_PORT}:localhost:3389 ubuntu@${{ secrets.AWS_HOST }} -N
