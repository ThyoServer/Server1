name: Thyo Server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force;
          netsh advfirewall firewall add rule name="RDP-Tunnel" dir=in action=allow protocol=TCP localport=3389;
          Restart-Service -Name TermService -Force;

      - name: Create RDP User
        run: |
          $charSet = @{ Upper = [char[]](65..90); Lower = [char[]](97..122); Number = [char[]](48..57) };
          $rawPassword = @();
          $rawPassword += $charSet.Upper | Get-Random -Count 5;
          $rawPassword += $charSet.Lower | Get-Random -Count 5;
          $rawPassword += $charSet.Number | Get-Random -Count 4;
          $password = -join ($rawPassword | Sort-Object { Get-Random });
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force;
          New-LocalUser -Name "thyo" -Password $securePass -AccountNeverExpires;
          Add-LocalGroupMember -Group "Administrators" -Member "thyo";
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "thyo";
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_CREDS=$password";

      - name: Windows Optimization & Web Dev Ports
        run: |
          netsh advfirewall firewall add rule name="Web-Dev-Ports" dir=in action=allow protocol=TCP localport=3000,5500,8080,80;
          Set-Service -Name "Audiosrv" -StartupType Automatic; Start-Service -Name "Audiosrv";
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableAudioCapture" -Value 0 -Force;
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -Force;

      - name: Buka Terowongan (Playit.gg) & Auto-Confirm
        run: |
          Write-Host "Mendownload Playit.gg versi terbaru..."
          $playitUrl = "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe"
          
          $Client = New-Object System.Net.WebClient
          $maxRetries = 3
          $retryCount = 0
          $success = $false
          
          while (-not $success -and $retryCount -lt $maxRetries) {
              try {
                  $retryCount++
                  Write-Host "Percobaan download ke-$retryCount..."
                  $Client.DownloadFile($playitUrl, "playit.exe")
                  $success = $true
              } catch {
                  Write-Host "⚠️ Download gagal ($($_.Exception.Message)), mencoba lagi dalam 3 detik..."
                  Start-Sleep -Seconds 3
              }
          }
          
          if (-not $success) {
              Write-Error "Gagal mendownload playit.exe setelah beberapa kali percobaan."
              exit 1
          }
          
          Write-Host "Menjalankan Playit.gg..."
          Start-Process -FilePath ".\playit.exe" -NoNewWindow -RedirectStandardOutput "playit_out.log" -RedirectStandardError "playit_err.log"
          
          Write-Host "Menunggu link klaim dan IP tercipta (20 detik)..."
          Start-Sleep -Seconds 20
          
          $log = (Get-Content "playit_out.log", "playit_err.log" -ErrorAction SilentlyContinue) -join "`n"
          
          $claimMatch = [regex]::Match($log, 'https://playit\.gg/claim/[a-zA-Z0-9-]+')
          if ($claimMatch.Success) {
              $claimUrl = $claimMatch.Value
              Write-Host "🔗 Link Klaim Ditemukan: $claimUrl"
              Write-Host "🤖 Mengonfirmasi sistem secara otomatis..."
              try {
                  Invoke-WebRequest -Uri $claimUrl -UseBasicParsing | Out-Null
                  Write-Host "✅ Berhasil konfirmasi otomatis!"
              } catch {
                  Write-Host "⚠️ Gagal auto-confirm, tapi lanjut membaca IP..."
              }
              Start-Sleep -Seconds 5
              $log = (Get-Content "playit_out.log", "playit_err.log" -ErrorAction SilentlyContinue) -join "`n"
          }
          
          # Pencarian IP/Port Playit yang akurat
          $playitIP = "Error: Gagal mendeteksi IP Playit"
          foreach ($line in ($log -split "`n")) {
              if ($line -match '([a-zA-Z0-9-]+\.ply\.gg:\d+)') {
                  $playitIP = $matches[1]
                  break
              } elseif ($line -match 'tcp\s+([0-9.]+|[a-zA-Z0-9.-]+):\d+') {
                  if ($matches[0] -notmatch '2026') {
                      $playitIP = $matches[1] + ":" + ($matches[0] -replace '.*:', '')
                      break
                  }
              }
          }
          
          if ($playitIP -eq "Error: Gagal mendeteksi IP Playit" -and $log -match '([a-zA-Z0-9-]{4,}\.ply\.gg:\d+)') {
              $playitIP = $matches[1]
          }
          
          Write-Host "✅ Terowongan Aktif: $playitIP"
          
          Write-Host "Mengirim data JSON ke server Railway..."
          $ram = [math]::Round((Get-CimInstance Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum).Sum / 1GB)
          $cpu = (Get-CimInstance Win32_Processor).Name
          $startTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          
          $payloadObj = @{
            status    = "Online"
            ip        = $playitIP
            username  = "thyo"
            password  = $env:RDP_CREDS
            cpu       = $cpu
            ram       = "$ram GB"
            startTime = $startTime
          }
          $payload = $payloadObj | ConvertTo-Json
          
          Invoke-RestMethod -Uri "https://webserver.up.railway.app/api/update-rdp" -Method Post -Body $payload -ContentType 'application/json'
          Write-Host "✅ Data berhasil terkirim ke Web Dashboard!"
          
          # 1. CETAK INFORMASI RDP SUKSES DI ATAS
          Write-Host "`n===================================================="
          Write-Host "RDP BERHASIL DIBUAT DAN SIAP DIGUNAKAN!"
          Write-Host "===================================================="
          Write-Host "📍 IP Address  : $playitIP"
          Write-Host "👤 Username    : thyo"
          Write-Host "🔑 Password    : $($env:RDP_CREDS)"
          Write-Host "===================================================="
          Write-Host "👉 https://webserver.up.railway.app/"
          Write-Host "====================================================`n"
          
          # 2. BARU DI BAWAHNYA MASUK KE CONSOLE LOADING / STABILIZER SERVER
          Write-Host "Memulai konsol penjaga server agar tetap aktif..."
          while ($true) { 
              Write-Host "[$(Get-Date)] RDP Active - Server berjalan stabil"
              Start-Sleep -Seconds 300 
          }
