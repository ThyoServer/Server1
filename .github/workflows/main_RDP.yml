name: Thyo Cloud Desktop (noVNC)

on:
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Menyiapkan Mesin Ubuntu & Layar Web
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies tightvncserver x11vnc novnc websockify curl wget
          
          # Membuat password VNC (Maksimal 8 karakter)
          mkdir -p ~/.vnc
          x11vnc -storepasswd "Thyo2026" ~/.vnc/passwd
          
          # Menyalakan VNC Server (Desktop)
          USER=runner vncserver :1 -geometry 1280x720 -depth 24
          
          # Mengaktifkan jembatan noVNC ke port 6080
          websockify --web /usr/share/novnc/ 6080 localhost:5901 &

      - name: Membuat Terowongan Layar Tanpa Batas (Cloudflare)
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          # Membuka jalur publik ke layar noVNC
          cloudflared tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &
          
          # Menunggu link tercipta
          sleep 12
          SCREEN_URL=$(grep -o 'https://[-0-9a-z]*\.trycloudflare.com' cloudflare.log | head -n 1)
          echo "$SCREEN_URL" > screen_url.txt

      - name: Menyetor Data Otomatis ke Web Dashboard Thyo
        run: |
          SCREEN_URL=$(cat screen_url.txt)
          START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Membungkus data untuk dikirim ke server.js kamu
          JSON_PAYLOAD=$(cat <<EOF
          {
            "status": "Online",
            "ip": "${SCREEN_URL}/vnc.html",
            "username": "admin",
            "password": "Thyo2026",
            "cpu": "GitHub Actions (2 Cores)",
            "ram": "7 GB Linux",
            "startTime": "${START_TIME}"
          }
          EOF
          )
          
          # Mengetuk pintu API Railway kamu!
          # PENTING: Ganti link di bawah kalau domain web kamu berbeda!
          curl -X POST https://webserver.up.railway.app/api/update-rdp \
          -H "Content-Type: application/json" \
          -d "$JSON_PAYLOAD"
