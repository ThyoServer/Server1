name: Thyo Server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force;
          netsh advfirewall firewall add rule name="RDP-Tunnel" dir=in action=allow protocol=TCP localport=3389;
          Restart-Service -Name TermService -Force;

      - name: Create RDP User
        run: |
          $charSet = @{ Upper = [char[]](65..90); Lower = [char[]](97..122); Number = [char[]](48..57) };
          $rawPassword = @();
          $rawPassword += $charSet.Upper | Get-Random -Count 5;
          $rawPassword += $charSet.Lower | Get-Random -Count 5;
          $rawPassword += $charSet.Number | Get-Random -Count 4;
          $password = -join ($rawPassword | Sort-Object { Get-Random });
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force;
          New-LocalUser -Name "thyo" -Password $securePass -AccountNeverExpires;
          Add-LocalGroupMember -Group "Administrators" -Member "thyo";
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "thyo";
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_CREDS=$password";

      - name: Windows Optimization & Web Dev Ports
        run: |
          netsh advfirewall firewall add rule name="Web-Dev-Ports" dir=in action=allow protocol=TCP localport=3000,5500,8080,80;
          Set-Service -Name "Audiosrv" -StartupType Automatic; Start-Service -Name "Audiosrv";
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableAudioCapture" -Value 0 -Force;
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -Force;

      - name: Buka Terowongan (Serveo) & Tahan Server
        run: |
          Write-Host "Membuka jalur Serveo via SSH bawaan Windows..."
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net" -NoNewWindow -RedirectStandardOutput "tunnel_out.log" -RedirectStandardError "tunnel_err.log"
          
          Start-Sleep -Seconds 12
          
          $log = (Get-Content "tunnel_out.log", "tunnel_err.log" -ErrorAction SilentlyContinue) -join "`n"
          $match = [regex]::Match($log, 'serveo\.net:(\d+)')
          
          if ($match.Success) {
              $tunnelIP = "serveo.net:" + $match.Groups[1].Value
              Write-Host "✅ Terowongan Berhasil: $tunnelIP"
          } else {
              $tunnelIP = "Error: Gagal mendapatkan link dari Serveo"
              Write-Host "Log Error: $log"
          }
          
          Write-Host "Mengirim data JSON ke server Railway..."
          $ram = [math]::Round((Get-CimInstance Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum).Sum / 1GB)
          $cpu = (Get-CimInstance Win32_Processor).Name
          $startTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          
          $payload = @{
            status    = "Online"
            ip        = $tunnelIP
            username  = "thyo"
            password  = $env:RDP_CREDS
            cpu       = $cpu
            ram       = "$ram GB"
            startTime = $startTime
          } | ConvertTo-Json
          
          Invoke-RestMethod -Uri "https://webserver.up.railway.app/api/update-rdp" -Method Post -Body $payload -ContentType 'application/json'
          Write-Host "✅ Data berhasil terkirim ke Web Dashboard!"
          
          Write-Host "`n========================================="
          Write-Host "RDP BERHASIL DIBUAT DAN SIAP DIGUNAKAN!"
          Write-Host "👉 https://webserver.up.railway.app/"
          Write-Host "=========================================`n"
          
          while ($true) { Write-Host "[$(Get-Date)] RDP Active - Server berjalan stabil"; Start-Sleep -Seconds 300; }
