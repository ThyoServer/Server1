name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force;
          netsh advfirewall firewall delete rule name="RDP-Inbound" -ErrorAction SilentlyContinue;
          netsh advfirewall firewall add rule name="RDP-Inbound" dir=in action=allow protocol=TCP localport=3389;
          Restart-Service -Name TermService -Force;

      - name: Create RDP User
        run: |
          $username = "thyo"
          $charSet = @{ Upper = [char[]](65..90); Lower = [char[]](97..122); Number = [char[]](48..57) };
          $rawPassword = @();
          $rawPassword += $charSet.Upper | Get-Random -Count 4;
          $rawPassword += $charSet.Lower | Get-Random -Count 4;
          $rawPassword += $charSet.Number | Get-Random -Count 4;
          $password = -join ($rawPassword | Sort-Object { Get-Random });
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force;
          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) { Remove-LocalUser -Name $username }
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires;
          Add-LocalGroupMember -Group "Administrators" -Member $username;
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username;
          
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_USER=$username";
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_CREDS=$password";

      - name: Windows Optimization & Web Dev Ports
        run: |
          netsh advfirewall firewall add rule name="Web-Dev-Ports" dir=in action=allow protocol=TCP localport=3000,5500,8080,80;
          Set-Service -Name "Audiosrv" -StartupType Automatic; Start-Service -Name "Audiosrv";
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableAudioCapture" -Value 0 -Force;
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -Force;

      - name: Setup SSH Key for VPS Gateway
        run: |
          Set-Content -Path "id_rsa" -Value "${{ secrets.AWS_SSH_KEY }}" -Encoding ascii
          $user = $env:USERNAME
          icacls "id_rsa" /inheritance:d
          icacls "id_rsa" /remove "Authenticated Users"
          icacls "id_rsa" /remove "BUILTIN\Users"
          icacls "id_rsa" /grant "${user}:F"

      - name: Generate Port & Send Initial Data
        run: |
          $remotePort = Get-Random -Minimum 3000 -Maximum 4001;
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_PORT=$remotePort";
          
          $ram = [math]::Round((Get-CimInstance Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum).Sum / 1GB)
          $cpu = (Get-CimInstance Win32_Processor).Name
          
          # ========================================================
          # 🚨 PENTING: UBAH "Server-X" DI BAWAH INI SESUAI REPO-NYA
          # ========================================================
          $payload = @{
            action    = "register"
            serverId  = "Server-1" 
            status    = "Online"
            ip        = "thyoserver.web.id:$remotePort"
            username  = "$env:RDP_USER"
            password  = "$env:RDP_CREDS"
            cpuName   = "$cpu"
            ram       = "$ram"
          } | ConvertTo-Json
          
          Invoke-RestMethod -Uri "https://thyocloud.up.railway.app/api/rdp" -Method Post -Body $payload -ContentType 'application/json'

      - name: Establish SSH Tunnel & Live Telemetry
        run: |
          $jobScript = {
            param($serverId, $apiUrl)
            while($true) {
              try {
                $cpuLoad = [math]::Round((Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average)
                $topApp = (Get-Process | Where-Object {$_.MainWindowTitle -ne ""} | Sort-Object CPU -Descending | Select-Object -First 1 Name).Name
                if ([string]::IsNullOrWhiteSpace($topApp)) { $topApp = "System Idle" }
                
                $payload = @{
                  action   = "telemetry"
                  serverId = $serverId
                  cpuLoad  = $cpuLoad
                  activity = $topApp
                } | ConvertTo-Json
                
                Invoke-RestMethod -Uri $apiUrl -Method Post -Body $payload -ContentType 'application/json' -ErrorAction SilentlyContinue
              } catch {}
              Start-Sleep -Seconds 10
            }
          }
          
          # ========================================================
          # 🚨 PENTING: PASTIKAN SAMA DENGAN NAMA DI ATAS!
          # ========================================================
          Start-Job -ScriptBlock $jobScript -ArgumentList "Server-1", "https://thyocloud.up.railway.app/api/rdp"
          
          # Tahan server tetap hidup dengan SSH Tunnel (Ini Mencegah Job Telemetry Terbunuh)
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ServerAliveInterval=60 -i id_rsa -R ${env:RDP_PORT}:localhost:3389 ubuntu@${{ secrets.AWS_HOST }} -N
